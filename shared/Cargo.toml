[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
rusttype = "0.9.3"
resvg = "0.47.0"
usvg = "0.47.0"
tiny-skia = { version = "0.12.0", features = ["png-format"] }
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zip = { version = "2.4.2", default-features = false }
base64 = "0.22.1"

[lib]
crate-type = ["cdylib", "rlib"]
